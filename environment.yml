# conda env for the mci baseline (GPU build on Windows / RTX 4060)
# torch is installed separately with the cu126 index — see README.
name: mci
channels:
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
      - numpy==1.26.4
      - opencv-python>=4.8
      - scikit-image>=0.22
      - scipy>=1.10
      - matplotlib>=3.7
      - pyyaml>=6.0
      - pandas>=2.0
      - tqdm>=4.60
      - pytest>=7.0
      # --- GPU / ML stack (Phase 2) ---
      # - torch==2.13.0          (use the cu126 index, see README)
      # - torchvision==0.28.0    (use the cu126 index, see README)
      # - ultralytics==8.4.115
      # - paddlepaddle==3.3.1    (CPU build — Windows torch+paddle-GPU conflict)
      # - paddleocr==3.7.0
