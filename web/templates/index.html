<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>材料曲线智能提取 — Web 演示</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>材料科学图像曲线智能识别与解析</h1>
  <p class="sub">上传曲线图（支持批量）→ 一键提取 → 叠加图展示 → 结构化数据下载</p>
</header>

<main>
  <!-- 上传区 -->
  <section class="card" id="upload-card">
    <h2>① 上传曲线图（支持多选 / 批量拖拽）</h2>
    <div class="dropzone" id="dropzone">
      <input type="file" id="file-input" accept=".png,.jpg,.jpeg" multiple hidden>
      <div class="dz-inner" id="dz-inner">
        <div class="dz-icon">📈</div>
        <p>点击选择 或 拖拽图片到此处（可一次多张）</p>
        <p class="hint">支持 PNG / JPG，单张 ≤ 20 MB</p>
      </div>
    </div>
    <ul class="file-list" id="file-list" hidden></ul>

    <h2>② 提取参数</h2>
    <div class="param-row">
      <label>刻度 OCR
        <select id="ocr-select">
          <option value="stub" selected>快速（标准答案刻度；上传图自动切换真实 OCR）</option>
          <option value="paddle">真实识别（PaddleOCR，首次约 10-30s 加载模型）</option>
        </select>
      </label>
      <label>曲线分割
        <select id="segmenter-select">
          <option value="unet" selected>深度学习 U-Net（推荐）</option>
          <option value="cv">经典 CV（训练免，精度较低）</option>
        </select>
      </label>
    </div>

    <div class="btn-row">
      <button class="btn primary big grow" id="btn-extract" disabled>
        <span id="btn-label">③ 批量提取（0 张）</span>
      </button>
      <button class="btn ghost" id="btn-clear-files" disabled>清空列表</button>
    </div>
    <p class="status" id="status"></p>
  </section>

  <!-- 结果区 -->
  <section class="card" id="result-card" hidden>
    <div class="result-head">
      <h2>提取结果</h2>
      <button class="btn ghost" id="btn-clear-results">清空结果</button>
    </div>
    <div id="results"></div>
  </section>

  <!-- 示例图 -->
  <section class="card" id="examples-card">
    <h2>快捷测试（示例图，点击即提取）</h2>
    <div class="examples" id="examples"></div>
  </section>
</main>

<footer>
  <p>materials-curve-intel · U-Net 512 + 坐标映射引擎 · 合成数据驱动 · 竞赛展示版</p>
</footer>

<script src="/static/app.js"></script>
</body>
</html>
