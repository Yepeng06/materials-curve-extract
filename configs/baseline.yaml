# ---------------------------------------------------------------------------
# mci baseline pipeline configuration
# Every key has a default in mci/pipeline/extractor.py::DEFAULTS;
# values here override them.
# ---------------------------------------------------------------------------

# ---- chart structure detection ----
axis_frac_threshold: 0.45   # ink fraction needed to accept an axis row/column

# ---- tick reading / OCR ----
ocr_backend: auto           # auto | paddle | stub (stub reads *_labels.json sidecar)
tick_assoc_tol_px: 25        # label<->mark pairing tolerance (px)
tick_min_score: 0.55         # B-5a: drop OCR boxes below this rec score (fragments)
x_kind_hint: auto           # auto | linear | log  (coordinate type judgement)
y_kind_hint: auto

# ---- curve segmentation ----
segmenter: multi_unet      # cv | unet | multi_unet (2026-08-20: 默认多曲线，最新成果)
unet_checkpoint: models/checkpoints/unet_curve.pt
unet_size: 512              # inference resolution (must match training resolution)
multi_unet_checkpoint: models/checkpoints/unet_multi_e1m.pt
multi_mask_thr: 0.35         # multi-channel mask threshold (E1m 最优 0.35)
multi_truncate_jumps: true  # cut chain tails that left the curve
multi_min_area: 450         # ghost-channel suppression (px; 0 = off)
multi_independent_mask: true  # candidate C phase 1: no argmax exclusion at crossings
multi_embed_merge: true       # 方案 E: GOI embedding small-cluster merge (unet_multi_goi.pt 起默认开)
multi_refine_radius: 4        # P1: skip window-centroid refine in approach zones (E1m 最优 4)
multi_refine_bias_y: -0.67
multi_truncate_lowconf: true   # P3: cut right-end drift tails (E1m 组合最优)
multi_truncate_lowconf_thr: 0.18  # P3: drift-tail confidence threshold

# ---- curve extraction ----
min_curve_area: 60          # min connected-component area inside the plot
max_points: 2000            # max output points per curve

# ---- misc ----
debug: false
